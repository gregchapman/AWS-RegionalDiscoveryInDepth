service: ec2
client: ec2
display_name: EC2 Instances

operations:
  - name: EC2 Instances
    method: describe_instances
    paginator: true
    result_key: Reservations
    unwrap_key: Instances
    id_field: InstanceId
    tag_name: true
    key_prefix: ec2
    dr_note: "AMI must exist in DR region. EIPs are region-specific."
    skip_if:
      State.Name: [terminated]
    config_fields:
      - InstanceId
      - InstanceType
      - ImageId
      - KeyName
      - SubnetId
      - VpcId
      - PrivateIpAddress
      - PublicIpAddress
      - IamInstanceProfile.Arn
      - State.Name
      - SecurityGroups[].GroupId
      - Placement.AvailabilityZone
      - Placement.Tenancy
      - Placement.GroupName
      - Placement.HostId
      - Placement.Affinity
      - Platform
      - Architecture
      - RootDeviceType
      - RootDeviceName
      - BlockDeviceMappings
      - EbsOptimized
      - EnaSupport
      - SriovNetSupport
      - NetworkInterfaces[].NetworkInterfaceId
      - NetworkInterfaces[].DeviceIndex
      - NetworkInterfaces[].SubnetId
      - NetworkInterfaces[].PrivateIpAddress
      - NetworkInterfaces[].Ipv6Addresses
      - CpuOptions.CoreCount
      - CpuOptions.ThreadsPerCore
      - HibernationOptions.Configured
      - MetadataOptions.HttpTokens
      - MetadataOptions.HttpPutResponseHopLimit
      - MetadataOptions.HttpEndpoint
      - MetadataOptions.InstanceMetadataTags
      - EnclaveOptions.Enabled
      - CreditSpecification.CpuCredits
      - ElasticGpuAssociations
      - LicenseSpecifications
      - CapacityReservationSpecification
