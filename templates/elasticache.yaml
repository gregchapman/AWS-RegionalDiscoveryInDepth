service: elasticache
client: elasticache
display_name: ElastiCache

operations:
  - name: ElastiCache Clusters
    method: describe_cache_clusters
    paginator: true
    result_key: CacheClusters
    id_field: CacheClusterId
    name_field: CacheClusterId
    key_prefix: elasticache
    dr_note: "Redis/Valkey: use Global Datastore or rebuild. Memcached: rebuild from config. Engine, AtRestEncryption, TransitEncryption are IMMUTABLE."
    kwargs:
      ShowCacheNodeInfo: true
    config_fields:
      - CacheClusterId
      - Engine
      - EngineVersion
      - CacheNodeType
      - NumCacheNodes
      - PreferredAvailabilityZone
      - CacheSubnetGroupName
      - CacheParameterGroup.CacheParameterGroupName
      - SecurityGroups[].SecurityGroupId
      - AtRestEncryptionEnabled
      - TransitEncryptionEnabled
      - TransitEncryptionMode
      - NetworkType
      - IpDiscovery
      - ReplicationGroupId
      - SnapshotRetentionLimit
      - PreferredMaintenanceWindow
      - AutoMinorVersionUpgrade
      - LogDeliveryConfigurations

  - name: ElastiCache Replication Groups
    method: describe_replication_groups
    paginator: true
    result_key: ReplicationGroups
    id_field: ReplicationGroupId
    name_field: Description
    key_prefix: elasticache-rg
    dr_note: "Replication group config needed to recreate cluster topology in DR. ClusterMode, AtRestEncryption, TransitEncryption are IMMUTABLE."
    config_fields:
      - ReplicationGroupId
      - Description
      - Status
      - MemberClusters
      - AutomaticFailover
      - MultiAZ
      - NodeGroups
      - ClusterEnabled
      - CacheNodeType
      - AtRestEncryptionEnabled
      - TransitEncryptionEnabled
      - TransitEncryptionMode
      - KmsKeyId
      - NetworkType
      - IpDiscovery
      - DataTiering
      - NumNodeGroups
      - ReplicasPerNodeGroup
      - SnapshotRetentionLimit
