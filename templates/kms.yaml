service: kms
client: kms
display_name: KMS Keys

operations:
  - name: KMS Keys
    method: list_keys
    paginator: true
    result_key: Keys
    id_field: KeyId
    name_field: KeyId
    key_prefix: kms
    dr_note: "KMS keys are region-specific. KeySpec, KeyUsage, and MultiRegion are IMMUTABLE. Create equivalent keys in DR with same aliases."
    config_fields:
      - KeyId
      - KeyArn
    foreach_detail:
      method: describe_key
      kwarg_name: KeyId
      parent_field: KeyId
      result_key: KeyMetadata
      config_fields:
        - KeyId
        - Arn
        - Description
        - KeyUsage
        - KeyState
        - KeySpec
        - MultiRegion
        - MultiRegionConfiguration
        - CustomerMasterKeySpec
        - Origin
        - KeyManager
        - CreationDate
        - Enabled
        - ExpirationModel
