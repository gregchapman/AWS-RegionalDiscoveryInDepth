service: s3
client: s3
display_name: S3 Buckets

operations:
  - name: S3 Buckets
    method: list_buckets
    paginator: false
    result_key: Buckets
    id_field: Name
    name_field: Name
    key_prefix: s3
    dr_note: "Bucket names are globally unique — DR buckets need different names. ObjectLockEnabled is IMMUTABLE (set at create time only). Enable CRR for buckets needed in DR."
    config_fields:
      - Name
      - CreationDate
      - BucketRegion
