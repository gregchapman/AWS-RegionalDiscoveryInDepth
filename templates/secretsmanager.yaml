service: secretsmanager
client: secretsmanager
display_name: Secrets Manager

operations:
  - name: Secrets
    method: list_secrets
    paginator: true
    result_key: SecretList
    id_field: ARN
    name_field: Name
    key_prefix: secret
    dr_note: "Values NOT exported. Recreate or use cross-region replication. Secrets without ReplicationStatus have NO DR copy."
    config_fields:
      - Name
      - ARN
      - Description
      - KmsKeyId
      - RotationEnabled
      - RotationRules
      - LastChangedDate
      - LastAccessedDate
      - ReplicationStatus
      - PrimaryRegion
      - CreatedDate
